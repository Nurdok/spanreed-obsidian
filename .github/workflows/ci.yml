name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # Type-checks the sources against the real Obsidian types and bundles
      # main.js, so a broken build fails the PR too.
      - run: npm run build

      - run: npm test
